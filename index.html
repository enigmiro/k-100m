<script>
/* ============================================================
   1. 설정 / 상태
============================================================= */
// 기본 기준 위치(위치 정보 제공을 거부했을 때 사용) — 서울시청
const DEFAULT_ORIGIN = { lat: 37.5665, lng: 126.9780 };
const INIT_CENTER = { lat: 36.3, lng: 127.8 };
const INIT_LEVEL = 13; // 전국이 한눈에 보이는 축소 레벨

const TYPE_META = {
  festival: { color: getCssVarLater("--c-festival"), label: "축제",  emoji: "🎪" },
  spot:     { color: getCssVarLater("--c-spot"),     label: "관광지", emoji: "📍" },
  food:     { color: getCssVarLater("--c-food"),     label: "맛집",  emoji: "🍽️" },
  stay:     { color: getCssVarLater("--c-stay"),     label: "숙박",  emoji: "🏨" },
  etc:      { color: getCssVarLater("--c-etc"),      label: "기타",  emoji: "✨" },
};
function getCssVarLater(name){
  // 스타일시트 파싱 이후 호출되도록 함수로 감싸 지연 평가
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

let map;
let geocoder;
let places;
let activeInfoWindow = null;
let allSpots = [];          // {title,address,sido,lat,lng,type,marker,...}
let searchTerm = "";
let selectedSido = "전국";
let originLatLng = null;    // 사용자 위치(또는 기본 위치)
let apiLoadFailed = false;

/* ============================================================
   2. 카카오맵 로드
============================================================= */
function loadKakaoMaps(){
  if(KAKAO_APP_KEY === "YOUR_KAKAO_APP_KEY"){
    document.getElementById("statusBar").textContent =
      "⚠️ 카카오맵 JavaScript 키가 설정되지 않았습니다. index.html 상단의 KAKAO_APP_KEY 값을 교체해주세요.";
    return;
  }
  const script = document.createElement("script");
  script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_APP_KEY}&libraries=services&autoload=false`;
  script.onload = ()=> kakao.maps.load(initMap);
  script.onerror = ()=>{
    document.getElementById("statusBar").textContent =
      "⚠️ 카카오맵 스크립트 로드에 실패했습니다. JavaScript 키와 등록된 플랫폼 도메인을 확인하세요.";
  };
  document.head.appendChild(script);
}

function initMap(){
  map = new kakao.maps.Map(document.getElementById("map"), {
    center: new kakao.maps.LatLng(INIT_CENTER.lat, INIT_CENTER.lng),
    level: INIT_LEVEL,
  });
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  geocoder = new kakao.maps.services.Geocoder();
  places = new kakao.maps.services.Places();

}

/* ============================================================
   3. 문화체육관광부_추천여행지 오픈API 호출 + 응답 파싱
   (실제 응답을 확인해보니 이 API는 좌표 필드가 없는 "소개 기사형"
    데이터입니다 — publisher/creator/title/description/insertDate.
    제목 끝에 장소명이 붙는 패턴(예: "..., 아산 현충사")을 이용해
    장소명을 추출한 뒤, 카카오맵 키워드 장소검색으로 좌표와 주소를
    알아내는 방식으로 지도에 표시합니다.)
============================================================= */
const TITLE_KEYS = ["title","TITLE","subject","SUBJECT","cntntsSj","CNTNTS_SJ"];
const DESC_KEYS  = ["description","DESCRIPTION","cntnts","CNTNTS"];
const DATE_KEYS  = ["insertDate","INSERT_DATE","regDate","REG_DATE"];

// 지오코딩 요청 개수(=키워드 검색 호출 수)를 제한하기 위한 조회 건수.
// 카카오 키워드검색을 항목당 1회씩 순차 호출하므로 너무 크면 초기 로딩이
// 오래 걸립니다. 필요하면 늘려도 되지만 300~500 선을 권장합니다.
const REQUEST_ROWS = 300;

function pick(obj, keys){
  for(const k of keys){
    if(obj[k] != null && String(obj[k]).trim() !== ""){
      return String(obj[k]).trim();
    }
  }
  return "";
}

// 응답 필드는 HTML 엔티티가 이중으로 이스케이프되어 있어(&amp;nbsp; 등)
// 두 번 디코딩한 뒤 태그를 제거합니다.
function decodeEntitiesTwice(s){
  const decodeOnce = (str)=>{
    const ta = document.createElement("textarea");
    ta.innerHTML = str;
    return ta.value;
  };
  return decodeOnce(decodeOnce(s || ""));
}
function stripHtml(s){
  return decodeEntitiesTwice(s).replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
}

// 제목 끝의 장소명 추출: "악동에서 영웅으로... 아산 현충사" → "아산 현충사"
function extractPlaceName(title){
  const parts = title.split(",");
  const last = parts[parts.length - 1].trim();
  return last.length >= 2 ? last : title.trim();
}

async function fetchRecommendedTravelSpots(){
  const params = new URLSearchParams({
    serviceKey: CULTURE_API_KEY,
    numOfRows: String(REQUEST_ROWS),
    pageNo: "1",
  });
  const requestUrl = `${CULTURE_API_ENDPOINT}?${params.toString()}`;

  // 주의: 커스텀 헤더(Content-type 등)를 붙이면 브라우저가 CORS 사전요청
  // (OPTIONS)을 먼저 보내는데, 일부 공공기관 서버는 이에 제대로 응답하지
  // 않아 "Failed to fetch"가 발생할 수 있습니다. GET 요청에는 굳이 필요
  // 없으므로 헤더 없이 단순 요청(simple request)으로 호출합니다.
  let res;
  try{
    res = await fetch(requestUrl);
  }catch(networkErr){
    console.error("네트워크/CORS 오류:", networkErr, requestUrl);
    throw new Error("네트워크 요청이 브라우저 단계에서 차단되었습니다(CORS 또는 접속 불가). " +
      "개발자도구 Network 탭에서 이 요청의 상태를 확인해주세요.");
  }
  if(!res.ok) throw new Error(`추천여행지 API 응답 오류: HTTP ${res.status}`);
  const text = await res.text();

  console.log("[추천여행지 API] 응답 원문(앞 500자):", text.slice(0, 500));

  const rawItems = parseApiResponse(text);
  console.log("[추천여행지 API] 파싱된 원본 항목 수:", rawItems.length,
    rawItems[0] ? "/ 첫 항목 키:" : "", rawItems[0] ? Object.keys(rawItems[0]) : "");

  return rawItems.map(raw=>{
    const rawTitle = pick(raw, TITLE_KEYS) || "(제목 없음)";
    const rawDesc = pick(raw, DESC_KEYS);
    return {
      title: rawTitle,
      description: stripHtml(rawDesc),
      insertDate: pick(raw, DATE_KEYS),
      placeName: extractPlaceName(rawTitle),
    };
  });
}

function classifyType(title, description){
  const text = (title + " " + description);
  if(/축제|페스티벌|불꽃|연등|박람회/.test(text)) return "festival";
  if(/맛집|음식|먹거리|식당/.test(text)) return "food";
  if(/숙박|호텔|펜션|리조트|게스트하우스/.test(text)) return "stay";
  return "spot"; // 이 데이터셋은 기본적으로 추천 "여행지" 소개 글이므로 관광지를 기본값으로 둠
}

// 응답 본문이 JSON인지 XML인지 자동 판별해 item 배열로 변환
function parseApiResponse(text){
  const trimmed = text.trim();
  if(trimmed.startsWith("{") || trimmed.startsWith("[")){
    const json = JSON.parse(trimmed);
    const body = json?.response?.body ?? json?.body ?? json;
    const itemsNode = body?.items?.item ?? body?.item ?? body?.items ?? [];
    return Array.isArray(itemsNode) ? itemsNode : [itemsNode];
  }
  // XML 파싱
  const xml = new DOMParser().parseFromString(trimmed, "application/xml");
  if(xml.querySelector("parsererror")){
    throw new Error("추천여행지 API 응답을 해석할 수 없습니다 (JSON/XML 아님).");
  }
  const resultCode = xml.querySelector("resultCode")?.textContent;
  const resultMsg = xml.querySelector("resultMsg")?.textContent;
  if(resultCode && resultCode !== "00" && resultCode !== "0000"){
    throw new Error(`추천여행지 API 오류(${resultCode}): ${resultMsg || ""}`);
  }
  const itemNodes = Array.from(xml.getElementsByTagName("item"));
  return itemNodes.map(node=>{
    const obj = {};
    Array.from(node.children).forEach(child=>{
      obj[child.tagName] = child.textContent;
    });
    return obj;
  });
}

/* ============================================================
   3-1. 카카오맵 키워드 장소검색으로 지오코딩
   (이 API에는 좌표가 없으므로, 추출한 장소명을 카카오 로컬 검색에
    넘겨 좌표·주소·시도를 알아냅니다. 결과는 localStorage에 캐시해
    다음 방문 시 재요청을 줄입니다.)
============================================================= */
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function keywordSearchOnce(keyword){
  return new Promise(resolve=>{
    places.keywordSearch(keyword, (data, status)=>{
      if(status === kakao.maps.services.Status.OK && data && data[0]){
        resolve(data[0]);
      }else{
        resolve(null);
      }
    });
  });
}

async function resolveCoordinates(articles, statusBar){
  const cache = JSON.parse(localStorage.getItem("placeGeocodeCache") || "{}");
  const spots = [];

  for(let i = 0; i < articles.length; i++){
    const a = articles[i];
    statusBar.textContent = `장소 위치 확인 중… (${i+1}/${articles.length}) ${a.placeName}`;

    if(!(a.placeName in cache)){
      const found = await keywordSearchOnce(a.placeName);
      cache[a.placeName] = found ? {
        lat: parseFloat(found.y),
        lng: parseFloat(found.x),
        address: found.road_address_name || found.address_name || "",
        sido: (found.address_name || "").split(" ")[0] || "",
        placeLabel: found.place_name || a.placeName,
      } : null;
      await sleep(140); // 실제로 카카오에 호출한 경우에만 살짝 대기(과호출 방지)
    }

    const geo = cache[a.placeName];
    if(geo && Number.isFinite(geo.lat) && Number.isFinite(geo.lng)){
      const spot = {
        title: a.title,
        description: a.description,
        address: geo.address,
        sido: geo.sido,
        lat: geo.lat,
        lng: geo.lng,
        insertDate: a.insertDate,
        type: classifyType(a.title, a.description),
        placeLabel: geo.placeLabel,
      };
      spots.push(spot);
      placeMarker(spot); // 찾는 즉시 지도에 바로 표시(점진적 렌더링)
    }
  }

  localStorage.setItem("placeGeocodeCache", JSON.stringify(cache));
  return spots;
}

/* ============================================================
   4. 위치 확인 (가까운 축제 정렬 기준)
============================================================= */
function resolveOrigin(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){
      resolve(DEFAULT_ORIGIN);
      return;
    }
    const timer = setTimeout(()=> resolve(DEFAULT_ORIGIN), 5000);
    navigator.geolocation.getCurrentPosition(
      pos=>{
        clearTimeout(timer);
        resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude });
      },
      ()=>{
        clearTimeout(timer);
        resolve(DEFAULT_ORIGIN);
      },
      { timeout: 4500, maximumAge: 300000 }
    );
  });
}

function distanceKm(a, b){
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI/180;
  const dLng = (b.lng - a.lng) * Math.PI/180;
  const sa = Math.sin(dLat/2)**2 +
    Math.cos(a.lat*Math.PI/180) * Math.cos(b.lat*Math.PI/180) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(sa));
}

/* ============================================================
   5. 전체 로드
============================================================= */
async function startDataLoad(){
  const statusBar = document.getElementById("statusBar");
  try{
    statusBar.textContent = "문화체육관광부 추천여행지 목록을 불러오는 중…";
    const [articles, origin] = await Promise.all([
      fetchRecommendedTravelSpots().catch(err=>{
        console.error(err);
        apiLoadFailed = true;
        statusBar.textContent = "⚠️ 추천여행지 API 호출 실패: " + err.message +
          " — 상단 CULTURE_API_ENDPOINT 값을 확인해주세요.";
        return [];
      }),
      resolveOrigin(),
    ]);

    originLatLng = origin;

    if(!apiLoadFailed && articles.length > 0){
      // 장소명을 카카오 키워드검색으로 순차 지오코딩(진행률을 상태바에 표시)
      allSpots = await resolveCoordinates(articles, statusBar);
    }

    if(apiLoadFailed){
      // 이미 catch에서 status 메시지를 세팅함
    }else if(articles.length === 0){
      statusBar.textContent = "⚠️ API 응답은 받았지만 목록이 0개입니다. " +
        "개발자도구(F12) 콘솔의 [추천여행지 API] 로그를 확인해주세요.";
    }else if(allSpots.length === 0){
      statusBar.textContent = "⚠️ 장소명은 받았지만 카카오 장소검색에서 좌표를 찾지 못했습니다.";
    }else{
      statusBar.classList.add("hidden");
    }
    updateHeaderStat(`총 ${allSpots.length}개 추천여행지 표시 중` +
      (articles.length > allSpots.length ? ` (조회 ${articles.length}건 중 위치 확인 성공)` : ""));
    renderList();
    renderNearbyFestivals();
  }catch(err){
    console.error(err);
    statusBar.textContent = "데이터를 불러오는 중 오류가 발생했습니다: " + err.message;
  }
}

function updateHeaderStat(text){
  document.getElementById("headerStat").innerHTML = text;
}

/* ============================================================
   6. 마커 / 정보창
============================================================= */
function makeMarkerImage(color){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18">
    <circle cx="9" cy="9" r="7" fill="${color}" stroke="#ffffff" stroke-width="2"/>
  </svg>`;
  const src = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
  return new kakao.maps.MarkerImage(src, new kakao.maps.Size(18,18), {
    offset: new kakao.maps.Point(9,9)
  });
}

function placeMarker(spot){
  const meta = TYPE_META[spot.type];
  const marker = new kakao.maps.Marker({
    position: new kakao.maps.LatLng(spot.lat, spot.lng),
    map,
    title: spot.title,
    image: makeMarkerImage(meta.color),
  });

  const shortDesc = spot.description
    ? (spot.description.length > 90 ? spot.description.slice(0, 90) + "…" : spot.description)
    : "";
  const descLine = shortDesc
    ? `<div style="font-size:12px;color:#555;margin-top:4px;max-width:260px;white-space:normal;line-height:1.5;">${shortDesc}</div>`
    : "";
  const dateLine = spot.insertDate
    ? `<div style="font-size:11px;color:#a5620f;margin-top:4px;white-space:nowrap;">📅 등록일 ${spot.insertDate}</div>`
    : "";
  const content = `
    <div style="font-family:inherit;padding:10px 14px;">
      <div style="font-weight:700;font-size:14px;margin-bottom:4px;white-space:nowrap;">${meta.emoji} ${spot.placeLabel || spot.title}</div>
      <div style="font-size:12px;color:#555;margin-bottom:2px;white-space:nowrap;">${meta.label}${spot.sido ? " · " + spot.sido : ""}</div>
      <div style="font-size:12px;color:#555;margin-bottom:2px;white-space:nowrap;">${spot.address}</div>
      ${descLine}
      ${dateLine}
    </div>`;

  kakao.maps.event.addListener(marker, "click", ()=> openInfo(marker, content));

  spot.marker = marker;
  spot.infoContent = content;
  applyVisibility(spot);
}

function openInfo(marker, content){
  if(!activeInfoWindow){
    activeInfoWindow = new kakao.maps.InfoWindow({ removable: true });
  }
  activeInfoWindow.setContent(content);
  activeInfoWindow.open(map, marker);
}

/* ============================================================
   7. 지역(시도) / 검색 필터
============================================================= */
function normalizeSido(s){
  return (s || "").replace(/(특별자치시|특별자치도|광역시|특별시|자치도|^세종$)/g, "").trim();
}

function matchesSido(spot){
  if(selectedSido === "전국") return true;
  const a = normalizeSido(spot.sido);
  const b = normalizeSido(selectedSido);
  if(!a) return false;
  return a.includes(b) || b.includes(a);
}

function applyVisibility(spot){
  if(!spot.marker) return;
  const matchesSearch = !searchTerm || spot.title.includes(searchTerm);
  spot.marker.setMap((matchesSido(spot) && matchesSearch) ? map : null);
}

function renderList(){
  const wrap = document.getElementById("listWrap");
  wrap.innerHTML = "";
  const visible = allSpots.filter(s => matchesSido(s) && (!searchTerm || s.title.includes(searchTerm)));

  if(visible.length === 0){
    wrap.innerHTML = `<div class="festival-empty" style="padding:14px 18px;">표시할 여행지가 없습니다.</div>`;
    return;
  }

  visible.forEach(spot=>{
    const meta = TYPE_META[spot.type];
    const item = document.createElement("div");
    item.className = "list-item";
    item.innerHTML = `
      <span class="tag" style="background:${meta.color}">${meta.emoji} ${meta.label}</span>
      <div class="name" style="display:inline">${spot.title}</div>
      <div class="meta">${spot.sido ? spot.sido + " · " : ""}${spot.address}</div>
    `;
    item.addEventListener("click", ()=> focusSpot(spot));
    wrap.appendChild(item);
  });
}

function focusSpot(spot){
  if(spot.lat == null) return;
  const pos = new kakao.maps.LatLng(spot.lat, spot.lng);
  map.setLevel(5);
  map.setCenter(pos);
  if(spot.marker) openInfo(spot.marker, spot.infoContent);
}

/* ============================================================
   8. 좌측 하단: 가까운 축제 목록 (최초 로딩 시 1회 계산)
============================================================= */
function renderNearbyFestivals(){
  const sub = document.getElementById("festivalSub");
  const listEl = document.getElementById("festivalList");
  listEl.innerHTML = "";

  let festivals = allSpots.filter(s => s.type === "festival");
  let usedFallback = false;

  // 데이터에 '축제'로 분류된 항목이 없다면(필드 구조가 예상과 다를 경우 대비),
  // 전체 추천여행지 중 가까운 순으로 대체 표시합니다.
  if(festivals.length === 0){
    festivals = allSpots;
    usedFallback = true;
  }

  if(festivals.length === 0){
    sub.textContent = apiLoadFailed
      ? "데이터를 불러오지 못했습니다."
      : "표시할 데이터가 없습니다.";
    return;
  }

  const withDist = festivals.map(s=>({
    spot: s,
    dist: distanceKm(originLatLng, { lat: s.lat, lng: s.lng }),
  })).sort((a,b)=> a.dist - b.dist).slice(0, 10);

  sub.textContent = usedFallback
    ? "축제 분류를 찾지 못해 가까운 추천여행지로 대체 표시합니다."
    : "현재 위치에서 가까운 순입니다.";

  withDist.forEach((row, idx)=>{
    const li = document.createElement("li");
    li.innerHTML = `
      <span class="rank">${idx+1}</span>
      <span class="fname">${row.spot.title}</span>
      <span class="fdist">${row.dist.toFixed(1)}km</span>
    `;
    li.addEventListener("click", ()=> focusSpot(row.spot));
    listEl.appendChild(li);
  });
}

/* ============================================================
   9. 이벤트 바인딩
============================================================= */
document.getElementById("sidoSelect").addEventListener("change", (e)=>{
  selectedSido = e.target.value;
  allSpots.forEach(applyVisibility);
  renderList();
});

document.getElementById("searchInput").addEventListener("input", (e)=>{
  searchTerm = e.target.value.trim();
  allSpots.forEach(applyVisibility);
  renderList();
});

loadKakaoMaps();
</script>
