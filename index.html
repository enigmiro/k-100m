<script>
/* ============================================================

// 기본 기준 위치(위치 정보 제공을 거부했을 때 사용) — 서울시청

// 해발고도 구간별 색상(초록 계열 3단계)
const ALT_META = [

function getCssVarLater(name){
  // 스타일시트 파싱 이후 호출되도록 지연 평가
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function altMeta(altitude){
  const alt = Number.isFinite(altitude) ? altitude : 0;
  return ALT_META.find(m => alt >= m.min) || ALT_META[ALT_META.length - 1];
}

let map;

/* ============================================================
   3. 100대명산 목록정보 오픈API 호출 + 응답 파싱
   - 이 API는 산식별자/산명/산코드/시도명/주소명/위도/경도/해발고도를
     직접 내려주므로 별도 지오코딩이 필요 없습니다.
   - 기관마다 오퍼레이션 경로가 달라 후보를 순서대로 시도하고,
     성공한 경로는 localStorage에 저장해 재사용합니다.
============================================================= */
// 응답 필드명이 명세에 따라 다를 수 있어 후보 키를 넉넉하게 둡니다.
const NAME_KEYS = ["mtnNm","mntnNm","mntNm","frtrlNm","mountainNm","name","MNTN_NM"];
const SIDO_KEYS = ["ctpvNm","sidoNm","ctprvnNm","sido","CTPV_NM"];
const ADDR_KEYS = ["addrNm","addr","address","lnmAddr","rdnmadr","ADDR_NM"];
const LAT_KEYS  = ["lat","latitude","mapY","LAT","yCrdnt"];
const LNG_KEYS  = ["lot","lon","lng","longitude","mapX","LOT","xCrdnt"];
const ALT_KEYS  = ["aslAltide","altitude","hg","mntHeight","ASL_ALTIDE","seaLvlAltd"];
const CODE_KEYS = ["mtnCd","mntnCd","mntCd","frtrlCd","MNTN_CD"];

function pick(obj, keys){
  for(const k of keys){
    if(obj[k] != null && String(obj[k]).trim() !== ""){
      return String(obj[k]).trim();
    }
  }
  return "";
}

// data.go.kr 게이트웨이는 인증키 미승인/오퍼레이션명 오류 등의 경우에도
// HTTP 상태코드만으로는 원인을 알 수 없고, 응답 본문(XML 또는 JSON)에
// resultCode/resultMsg(또는 returnAuthMsg 등)로 실제 사유를 담아 줍니다.
// 그래서 res.ok 여부와 무관하게 항상 본문을 읽어 메시지를 뽑아냅니다.
function extractServerMessage(text){
  const trimmed = (text || "").trim();
  if(!trimmed) return "";
  try{
    if(trimmed.startsWith("{") || trimmed.startsWith("[")){
      const json = JSON.parse(trimmed);
      const header = json?.response?.header ?? json?.header ?? json;
      const code = header?.resultCode ?? header?.returnReasonCode;
      const msg = header?.resultMsg ?? header?.returnAuthMsg ?? header?.errMsg;
      if(code || msg) return `[${code ?? "?"}] ${msg ?? ""}`.trim();
    }else{
      const xml = new DOMParser().parseFromString(trimmed, "application/xml");
      if(!xml.querySelector("parsererror")){
        const code = xml.querySelector("resultCode, returnReasonCode")?.textContent;
        const msg = xml.querySelector("resultMsg, returnAuthMsg, errMsg")?.textContent;
        if(code || msg) return `[${code ?? "?"}] ${msg ?? ""}`.trim();
      }
    }
  }catch(e){ /* 파싱 실패 시 아래에서 원문 일부를 그대로 노출 */ }
  return trimmed.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim().slice(0, 200);
}

async function fetchTop100Mountains(){
  const savedOp = localStorage.getItem("top100ApiOperation");
  const candidates = savedOp != null
    ? [savedOp, ...OPERATION_CANDIDATES.filter(c => c !== savedOp)]
    : OPERATION_CANDIDATES;

  const attemptLogs = []; // 모든 시도의 결과를 누적(최종 에러 메시지에 전부 표시)

  for(const op of candidates){
    // 인증키는 이미 인코딩된 값이므로 문자열로 그대로 연결합니다.
    // data.go.kr 표준 파라미터는 _type 하나만 사용합니다(중복 파라미터는 게이트웨이에서
    // 오히려 400/파싱오류의 원인이 될 수 있어 제거).
    const requestUrl = `${MOUNTAIN_API_ENDPOINT}${op}` +
      `?serviceKey=${MOUNTAIN_API_KEY}&pageNo=1&numOfRows=100&_type=json`;
    let text = "";
    try{
      const res = await fetch(requestUrl);
      text = await res.text();
      console.log(`[100대명산 API] 시도 경로: "${op}" / HTTP ${res.status} / 응답 앞 400자:`, text.slice(0, 400));

      if(!res.ok){
        const serverMsg = extractServerMessage(text);
        attemptLogs.push(`"${op || "(루트)"}" → HTTP ${res.status}${serverMsg ? " / " + serverMsg : ""}`);
        continue;
      }
      const items = parseApiResponse(text);
      if(items.length > 0){
        localStorage.setItem("top100ApiOperation", op);
        return items;
      }
      attemptLogs.push(`"${op || "(루트)"}" → 정상 응답이지만 목록 0건${extractServerMessage(text) ? " / " + extractServerMessage(text) : ""}`);
    }catch(err){
      // JSON.parse 실패, resultCode 오류(parseApiResponse가 던진 것) 등
      const serverMsg = extractServerMessage(text);
      attemptLogs.push(`"${op || "(루트)"}" → ${err.message}${serverMsg ? " / " + serverMsg : ""}`);
    }
  }
  console.log("[100대명산 API] 전체 시도 요약:", attemptLogs);
  throw new Error("모든 오퍼레이션 경로 시도 실패.\n" + attemptLogs.join("\n"));
}

// 응답 본문이 JSON인지 XML인지 자동 판별해 item 배열로 변환
function parseApiResponse(text){
  const trimmed = text.trim();
  if(trimmed.startsWith("{") || trimmed.startsWith("[")){
    const json = JSON.parse(trimmed);
    // resultCode가 실패면 오류로 처리
    const header = json?.response?.header ?? json?.header;
    if(header?.resultCode && !["00","0000"].includes(String(header.resultCode))){
      throw new Error(`API 오류(${header.resultCode}): ${header.resultMsg || ""}`);
    }
    const body = json?.response?.body ?? json?.body ?? json;
    const itemsNode = body?.items?.item ?? body?.item ?? body?.items ?? [];
    return (Array.isArray(itemsNode) ? itemsNode : [itemsNode]).filter(Boolean);
  }
  // XML 파싱
  const xml = new DOMParser().parseFromString(trimmed, "application/xml");
  if(xml.querySelector("parsererror")){
    throw new Error("응답을 해석할 수 없습니다 (JSON/XML 아님).");
  }
  const resultCode = xml.querySelector("resultCode")?.textContent;
  const resultMsg = xml.querySelector("resultMsg")?.textContent;
  if(resultCode && resultCode !== "00" && resultCode !== "0000"){
    throw new Error(`API 오류(${resultCode}): ${resultMsg || ""}`);
  }
  const itemNodes = Array.from(xml.getElementsByTagName("item"));
  return itemNodes.map(node=>{
    const obj = {};
    Array.from(node.children).forEach(child=>{
      obj[child.tagName] = child.textContent;
    });
    return obj;
  });
}

function toMountain(raw){
  const lat = parseFloat(pick(raw, LAT_KEYS));
  const lng = parseFloat(pick(raw, LNG_KEYS));
  if(!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
  const altitude = parseFloat(pick(raw, ALT_KEYS));
  return {
    name: pick(raw, NAME_KEYS) || "(이름 없음)",
    code: pick(raw, CODE_KEYS),
    sido: pick(raw, SIDO_KEYS),
    address: pick(raw, ADDR_KEYS),
    altitude: Number.isFinite(altitude) ? Math.round(altitude) : null,
    lat, lng,
  };
}

/* ============================================================
   4. 위치 확인 (가까운 명산 정렬 기준)
============================================================= */
function resolveOrigin(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){
      resolve(DEFAULT_ORIGIN);
      return;
    }
    const timer = setTimeout(()=> resolve(DEFAULT_ORIGIN), 5000);
    navigator.geolocation.getCurrentPosition(
      pos=>{
        clearTimeout(timer);
        resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude });
      },
      ()=>{
        clearTimeout(timer);
        resolve(DEFAULT_ORIGIN);
      },
      { timeout: 4500, maximumAge: 300000 }
    );
  });
}

function distanceKm(a, b){
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI/180;
  const dLng = (b.lng - a.lng) * Math.PI/180;
  const sa = Math.sin(dLat/2)**2 +
    Math.cos(a.lat*Math.PI/180) * Math.cos(b.lat*Math.PI/180) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(sa));
}

/* ============================================================
   5. 전체 로드
============================================================= */
async function startDataLoad(){
  const statusBar = document.getElementById("statusBar");
  try{
    statusBar.textContent = "100대 명산 목록을 불러오는 중…";
    const [rawItems, origin] = await Promise.all([
      fetchTop100Mountains().catch(err=>{
        console.error(err);
        apiLoadFailed = true;
        statusBar.textContent = "⚠️ 100대명산 API 호출 실패: " + err.message;
        return [];
      }),
      resolveOrigin(),
    ]);

    originLatLng = origin;

    if(!apiLoadFailed){
      allMountains = rawItems.map(toMountain).filter(Boolean);
      allMountains.sort((a,b)=> a.name.localeCompare(b.name, "ko"));
      allMountains.forEach(placeMarker);
    }

    if(apiLoadFailed){
      // 이미 catch에서 status 메시지를 세팅함
    }else if(rawItems.length === 0){
      statusBar.textContent = "⚠️ API 응답은 받았지만 목록이 0개입니다. " +
        "개발자도구(F12) 콘솔의 [100대명산 API] 로그를 확인해주세요.";
    }else if(allMountains.length === 0){
      statusBar.textContent = "⚠️ 목록은 받았지만 위도/경도 필드를 찾지 못했습니다. " +
        "콘솔에서 첫 항목의 키 이름을 확인해 LAT_KEYS/LNG_KEYS에 추가해주세요.";
      console.log("[100대명산 API] 첫 항목:", rawItems[0]);
    }else{
      statusBar.classList.add("hidden");
    }
    updateHeaderStat(`총 <b>${allMountains.length}</b>개 명산 표시 중`);
    renderList();
    renderNearbyMountains();
  }catch(err){
    console.error(err);
    statusBar.textContent = "데이터를 불러오는 중 오류가 발생했습니다: " + err.message;
  }
}

function updateHeaderStat(text){
  document.getElementById("headerStat").innerHTML = text;
}

/* ============================================================
   6. 마커 / 정보창  ★ 위치 표시는 원이 아닌 "삼각형"으로 렌더링
============================================================= */
function makeTriangleMarkerImage(color){
  // 산 모양을 연상시키는 삼각형 마커(SVG). 꼭짓점이 위, 밑변이 아래.
  const w = 22, h = 20;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polygon points="${w/2},2 ${w-2},${h-2} 2,${h-2}"
      fill="${color}" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  </svg>`;
  const src = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
  return new kakao.maps.MarkerImage(src, new kakao.maps.Size(w, h), {
    // 삼각형 밑변 중앙이 실제 좌표를 가리키도록 오프셋 지정
    offset: new kakao.maps.Point(w/2, h-2)
  });
}

function placeMarker(mtn){
  const meta = altMeta(mtn.altitude);
  const marker = new kakao.maps.Marker({
    position: new kakao.maps.LatLng(mtn.lat, mtn.lng),
    map,
    title: mtn.name,
    image: makeTriangleMarkerImage(meta.color),
  });

  const altLine = mtn.altitude != null
    ? `<div style="font-size:12px;color:#2c5a1e;margin-top:2px;white-space:nowrap;">⛰️ 해발 ${mtn.altitude.toLocaleString()}m (${meta.label})</div>`
    : "";
  const content = `
    <div style="font-family:inherit;padding:10px 14px;">
      <div style="font-weight:700;font-size:14px;margin-bottom:4px;white-space:nowrap;">🌲 ${mtn.name}</div>
      <div style="font-size:12px;color:#555;margin-bottom:2px;white-space:nowrap;">${mtn.sido || ""}</div>
      <div style="font-size:12px;color:#555;margin-bottom:2px;white-space:nowrap;">${mtn.address || ""}</div>
      ${altLine}
    </div>`;

  kakao.maps.event.addListener(marker, "click", ()=> openInfo(marker, content));

  mtn.marker = marker;
  mtn.infoContent = content;
  applyVisibility(mtn);
}

function openInfo(marker, content){
  if(!activeInfoWindow){
    activeInfoWindow = new kakao.maps.InfoWindow({ removable: true });
  }
  activeInfoWindow.setContent(content);
  activeInfoWindow.open(map, marker);
}

/* ============================================================
   7. 지역(시도) / 검색 필터
============================================================= */
function normalizeSido(s){
  return (s || "").replace(/(특별자치시|특별자치도|광역시|특별시|자치도|^세종$)/g, "").trim();
}

function matchesSido(mtn){
  if(selectedSido === "전국") return true;
  // 시도명 필드가 비어있으면 주소로도 판별
  const src = mtn.sido || mtn.address || "";
  const a = normalizeSido(src.split(" ")[0]);
  const b = normalizeSido(selectedSido);
  if(!a) return false;
  return a.includes(b) || b.includes(a) || src.includes(b);
}

function applyVisibility(mtn){
  if(!mtn.marker) return;
  const matchesSearch = !searchTerm || mtn.name.includes(searchTerm);
  mtn.marker.setMap((matchesSido(mtn) && matchesSearch) ? map : null);
}

function renderList(){
  const wrap = document.getElementById("listWrap");
  wrap.innerHTML = "";
  const visible = allMountains.filter(m => matchesSido(m) && (!searchTerm || m.name.includes(searchTerm)));

  if(visible.length === 0){
    wrap.innerHTML = `<div class="near-empty" style="padding:14px 18px;">표시할 명산이 없습니다.</div>`;
    return;
  }

  visible.forEach(mtn=>{
    const meta = altMeta(mtn.altitude);
    const altText = mtn.altitude != null ? `${mtn.altitude.toLocaleString()}m` : "고도 미상";
    const item = document.createElement("div");
    item.className = "list-item";
    item.innerHTML = `
      <span class="tag" style="background:${meta.color}">▲ ${altText}</span>
      <div class="name" style="display:inline">${mtn.name}</div>
      <div class="meta">${mtn.sido ? mtn.sido + " · " : ""}${mtn.address || ""}</div>
    `;
    item.addEventListener("click", ()=> focusMountain(mtn));
    wrap.appendChild(item);
  });
}

function focusMountain(mtn){
  if(mtn.lat == null) return;
  const pos = new kakao.maps.LatLng(mtn.lat, mtn.lng);
  map.setLevel(7);
  map.setCenter(pos);
  if(mtn.marker) openInfo(mtn.marker, mtn.infoContent);
}

/* ============================================================
   8. 좌측 하단: 가까운 명산 목록 (최초 로딩 시 1회 계산)
============================================================= */
function renderNearbyMountains(){
  const sub = document.getElementById("nearSub");
  const listEl = document.getElementById("nearList");
  listEl.innerHTML = "";

  if(allMountains.length === 0){
    sub.textContent = apiLoadFailed
      ? "데이터를 불러오지 못했습니다."
      : "표시할 데이터가 없습니다.";
    return;
  }

  const withDist = allMountains.map(m=>({
    mtn: m,
    dist: distanceKm(originLatLng, { lat: m.lat, lng: m.lng }),
  })).sort((a,b)=> a.dist - b.dist).slice(0, 10);

  sub.textContent = "현재 위치에서 가까운 순입니다.";

  withDist.forEach((row, idx)=>{
    const li = document.createElement("li");
    li.innerHTML = `
      <span class="rank">${idx+1}</span>
      <span class="fname">${row.mtn.name}</span>
      <span class="fdist">${row.dist.toFixed(1)}km</span>
    `;
    li.addEventListener("click", ()=> focusMountain(row.mtn));
    listEl.appendChild(li);
  });
}

/* ============================================================
   9. 이벤트 바인딩
============================================================= */
document.getElementById("sidoSelect").addEventListener("change", (e)=>{
  selectedSido = e.target.value;
  allMountains.forEach(applyVisibility);
  renderList();
});

document.getElementById("searchInput").addEventListener("input", (e)=>{
  searchTerm = e.target.value.trim();
  allMountains.forEach(applyVisibility);
  renderList();
});

loadKakaoMaps();
</script>
